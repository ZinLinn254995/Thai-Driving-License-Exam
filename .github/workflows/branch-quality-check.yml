name: Branch quality check

on:
  push:
    branches:
      - work/adsense-readiness-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/adsense-readiness-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: add npm dependency lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "package-lock.json is unchanged"
          fi

  build:
    needs: lockfile
    if: always() && (needs.lockfile.result == 'success' || needs.lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/work/adsense-readiness-audit' && 'work/adsense-readiness-audit' || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
