name: Branch quality check

on:
  push:
    branches:
      - work/adsense-readiness-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit generated lockfile on the working branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/adsense-readiness-audit'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: add npm dependency lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "package-lock.json is unchanged"
          fi
      - name: Upload generated dependency lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Verify reproducible clean install
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
